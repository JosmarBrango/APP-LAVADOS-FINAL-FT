<!-- ─── VISTA: Historial / Escáner QR ───────────────────── -->
<div id="view-historial" class="section">
  <div class="filter-bar hist-filter-bar">
    <div class="hist-actions-top">
      <button class="btn btn-primary btn-qr-scan" onclick="startQRScanner()">
        <span class="material-symbols-outlined" style="font-size:22px;">qr_code_scanner</span>
        <span>Escanear Código QR</span>
      </button>
      <button class="btn btn-em btn-manual-reg" onclick="openLavadoModal()">
        <span class="material-symbols-outlined" style="font-size:18px;">add_task</span>
        <span>Registro Manual</span>
      </button>
    </div>

    <div class="hist-filters-group">
      <div class="hist-date-range">
        <input id="histDesde" type="date" title="Desde" onchange="renderHistorial()">
        <span class="hist-date-sep">→</span>
        <input id="histHasta" type="date" title="Hasta" onchange="renderHistorial()">
      </div>
      <div class="hist-search-row">
        <input id="histSearch" class="hist-search-input" type="text" placeholder="Buscar placa…"
          oninput="renderHistorial()">
        <button class="btn btn-ghost btn-hist-clear"
          onclick="document.getElementById('histDesde').value='';document.getElementById('histHasta').value='';document.getElementById('histSearch').value='';renderHistorial();">
          ✕ Limpiar
        </button>
      </div>
    </div>

    <div class="hist-status-row">
      <span class="tbl-count hist-count-badge" id="histCount">0 registros</span>
    </div>
  </div>

  <div id="qr-reader-container" class="qr-scanner-card" style="display:none;">
    <div class="qr-scanner-header">
      <span style="font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;">
        <span class="material-symbols-outlined" style="font-size:20px;color:var(--accent);">qr_code_scanner</span>
        Escáner de Lavados
      </span>
      <button class="btn btn-ghost btn-close-cam" onclick="stopQRScanner()">✕ Cerrar Cámara</button>
    </div>
    <div id="qr-reader" style="width:100%"></div>
  </div>

  <div class="table-wrap">
    <table class="tbl tbl-lavados tbl-historial">
      <thead>
        <tr>
          <th>Placa</th>
          <th>Municipio</th>
          <th>Tipo</th>
          <th>Fecha</th>
          <th style="text-align:center;">Llegada</th>
          <th>Lavadores</th>
          <th style="text-align:center;">INFO</th>
          <th style="text-align:center;">Origen</th>
          {% if user.get('role') == 'admin' %}<th style="text-align:right">Acc.</th>{% endif %}
        </tr>
      </thead>
      <tbody id="histBody"></tbody>
    </table>
  </div>
</div>
