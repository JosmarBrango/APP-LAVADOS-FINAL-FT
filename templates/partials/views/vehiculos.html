<!-- ─── VISTA: Gestión de Vehículos ───────────────────── -->
<div id="view-vehiculos" class="section">
  <div class="filter-bar">
    <select id="vehMun" onchange="renderVehiculos()">
      <option value="">Todos los municipios</option>
    </select>
    <input id="vehSearch" type="text" placeholder="Buscar placa…" oninput="renderVehiculos()"
      style="background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--sans);font-size:13px;padding:9px 14px;outline:none;width:160px;">
    {% if user.get('role') == 'admin' %}
    <button class="btn btn-primary" onclick="openVehicleModal()"
      style="padding:9px 18px;font-size:13px;gap:6px;">
      ➕ Agregar vehículo
    </button>
    {% endif %}
    <span class="tbl-count" id="vehCount">0 vehículos</span>
  </div>
  <div class="table-wrap">
    <table class="tbl">
      <thead>
        <tr>
          <th>Placa</th>
          <th>Municipio</th>
          <th>Tipo</th>
          <th>Ruta</th>
          <th>Supervisor</th>
          <th style="text-align:right">Acciones</th>
        </tr>
      </thead>
      <tbody id="vehBody"></tbody>
    </table>
  </div>
</div>
