<!-- ─── VISTA: Gestión de Vehículos ───────────────────── -->
<div id="view-vehiculos" class="section">
  <div class="filter-bar veh-filter-bar">
    <div class="veh-filters-group">
      <select id="vehMun" class="veh-select-mun" onchange="renderVehiculos()">
        <option value="">Todos los municipios</option>
      </select>
      <input id="vehSearch" class="veh-search-input" type="text" placeholder="Buscar placa…" oninput="renderVehiculos()">
    </div>
    <div class="veh-actions-group">
      {% if user.get('role') == 'admin' %}
      <button class="btn btn-primary btn-add-vehicle" onclick="openVehicleModal()">
        <span class="material-symbols-outlined" style="font-size: 18px;">add_circle</span> Agregar vehículo
      </button>
      {% endif %}
      <span class="tbl-count veh-count-badge" id="vehCount">0 vehículos</span>
    </div>
  </div>
  <div class="table-wrap veh-table-wrap">
    <table class="tbl tbl-vehiculos">
      <thead>
        <tr>
          <th>Placa</th>
          <th>Municipio</th>
          <th>Tipo</th>
          <th>Ruta</th>
          <th>Supervisor</th>
          <th style="text-align:right">Acciones</th>
        </tr>
      </thead>
      <tbody id="vehBody"></tbody>
    </table>
  </div>
</div>
