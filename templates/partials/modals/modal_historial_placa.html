<!-- Modal Historial por Placa -->
<div class="modal-bg" id="modalHistorialPlaca">
  <div class="modal" style="max-width:600px">
    <div class="modal-title" id="mhpTitle">Historial de lavados</div>
    <div class="modal-sub" id="mhpSub">Selecciona un lavado para eliminarlo.</div>
    <div style="max-height:400px;overflow-y:auto;margin-top:12px;">
      <table class="tbl" style="font-size:13px;">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Tipo</th>
            <th>Lavadores</th>
            <th>Inicio → Fin</th>
            <th style="text-align:right">Acción</th>
          </tr>
        </thead>
        <tbody id="mhpBody"></tbody>
      </table>
    </div>
    <div class="btn-row" style="margin-top:16px;">
      <button class="btn btn-ghost" onclick="closeModal('modalHistorialPlaca')">Cerrar</button>
    </div>
  </div>
</div>
