<!-- Modal User (Configuración) -->
<div class="modal-bg" id="modalUser">
  <div class="modal">
    <div class="modal-title" id="muTitle">Nuevo Usuario</div>
    <div class="modal-sub" id="muSub">Crea una nueva cuenta de acceso al sistema.</div>
    <form id="formUser" onsubmit="saveUser(event)">
      <div class="field-row" id="muCredencialesRow">
        <div class="field"><label>Usuario</label><input type="text" id="muUsername" required></div>
        <div class="field"><label>Contraseña</label><input type="text" id="muPassword" required></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Nombre Completo</label><input type="text" id="muName" required></div>
        <div class="field"><label>Rol</label>
          <select id="muRole" onchange="toggleUserFields()" required
            style="width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--s2);font-family:var(--sans);font-size:14px;color:var(--text);outline:none;">
            <option value="lavador">Lavador</option>
            <option value="admin">Administrador</option>
          </select>
        </div>
      </div>
      <div class="field" style="display:flex;align-items:center;gap:8px;">
        <input type="checkbox" id="muActive" checked style="width:18px;height:18px;">
        <label for="muActive" style="margin:0;cursor:pointer;">Cuenta activa</label>
      </div>
      <div class="btn-row">
        <button type="button" class="btn btn-ghost" onclick="closeModal('modalUser')">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar usuario</button>
      </div>
    </form>
  </div>
</div>
