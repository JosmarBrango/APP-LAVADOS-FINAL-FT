<!-- Modal Registrar Lavado -->
<div class="modal-bg" id="modalLavado">
  <div class="modal modal-lavado-form" style="max-width:540px">
    <div class="modal-title">Registrar lavado</div>
    <div class="modal-sub">Registra un lavado realizado para actualizar los indicadores.</div>
    <form id="formLavado" onsubmit="saveLavado(event)" class="lav-modal-form">

      <!-- Fila 1: Placa + Tipo -->
      <div class="lav-form-row lav-form-row-2">
        <div class="lav-form-field">
          <label class="lav-form-label">Placa del vehículo</label>
          <input type="text" id="mlPlaca" list="placasList" required placeholder="Ej: ABC123"
            autocomplete="off" class="lav-form-input" style="text-transform:uppercase;">
          <datalist id="placasList"></datalist>
        </div>
        <div class="lav-form-field">
          <label class="lav-form-label">Tipo de lavado</label>
          <select id="mlTipoLavado" required class="lav-form-input lav-form-select">
            <option value="" disabled selected>Selecciona...</option>
            <option value="General">Lavado General</option>
            <option value="Sencillo">Lavado Sencillo</option>
            <option value="Enjuague">Solo Enjuague</option>
          </select>
        </div>
      </div>

      <!-- Fila 2: Municipio -->
      <div class="lav-form-field">
        <label class="lav-form-label">Municipio</label>
        <input type="text" id="mlMunicipio" placeholder="Ej: Apartadó, Turbo..." class="lav-form-input">
      </div>

      <!-- Fila 3: Lavadores -->
      <div class="lav-form-field">
        <label class="lav-form-label">Lavadores
          <span class="lav-form-hint">(selecciona todos los que participaron)</span>
        </label>
        <div id="mlLavadoresList" style="display:flex;flex-direction:column;gap:8px;">
          <div style="display:flex;gap:8px;align-items:center;" class="lav-row">
            <select name="mlLavadorSel" class="ml-lav-select lav-form-input" style="flex:1;">
              <option value="" disabled selected>Selecciona un lavador...</option>
            </select>
          </div>
        </div>
        <button type="button" id="btnAddMlLavador" onclick="addModalLavRow()" class="lav-add-lav-btn">
          ＋ Agregar otro lavador
        </button>
      </div>

      <!-- Fila 4: Fecha -->
      <div class="lav-form-field">
        <label class="lav-form-label">Fecha del lavado
          <span class="lav-form-hint">(solo se permite la fecha de hoy)</span>
        </label>
        <input type="date" id="mlFechaVisible" disabled class="lav-form-input lav-date-disabled">
        <input type="hidden" id="mlFecha">
      </div>

      <!-- Fila 5: Horas — 3 campos en grilla 2+1 en mobile -->
      <div class="lav-form-field">
        <label class="lav-form-label">Tiempos del lavado</label>
        <div class="lav-times-grid">
          <div class="lav-time-field">
            <span class="lav-time-label">Llegada lavadero</span>
            <input type="time" id="mlHoraLlegada" class="lav-form-input lav-time-input">
          </div>
          <div class="lav-time-field">
            <span class="lav-time-label">Inicio lavado</span>
            <input type="time" id="mlHoraInicio" class="lav-form-input lav-time-input">
          </div>
          <div class="lav-time-field">
            <span class="lav-time-label">Fin lavado</span>
            <input type="time" id="mlHoraFin" class="lav-form-input lav-time-input">
          </div>
        </div>
      </div>

      <!-- Badge tiempos calculados -->
      <div id="mlCalcBadges" style="display:none;gap:8px;flex-wrap:wrap;">
        <span class="lav-calc-badge">⏳ Espera: <b id="mlValEspera">—</b></span>
        <span class="lav-calc-badge">🚿 Duración: <b id="mlValLavado">—</b></span>
      </div>

      <!-- Botones -->
      <div class="btn-row lav-btn-row">
        <button type="button" class="btn btn-ghost" onclick="closeModal('modalLavado')">Cancelar</button>
        <button type="submit" class="btn btn-em">Registrar lavado</button>
      </div>
    </form>
  </div>
</div>
