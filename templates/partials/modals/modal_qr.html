<!-- Modal QR -->
<div class="modal-bg" id="modalQR">
  <div class="modal" style="max-width:380px;text-align:center">
    <div class="modal-title" id="qrTitleText">Código QR</div>
    <div class="modal-sub">Comparte este enlace para registrar lavados desde el celular, sin necesidad de ingresar al
      panel.</div>
    <div class="qr-wrap" id="qrCanvas"></div>
    <div class="qr-url" id="qrUrlText"></div>
    <div class="btn-row" style="flex-wrap:wrap;gap:8px;justify-content:center;">
      <button class="btn btn-ghost" onclick="closeModal('modalQR')">Cerrar</button>
      <button class="btn btn-ghost" onclick="printCurrentQR()">Imprimir</button>
      <button class="btn btn-primary" onclick="downloadCurrentQR()">Descargar PNG</button>
    </div>
  </div>
</div>
