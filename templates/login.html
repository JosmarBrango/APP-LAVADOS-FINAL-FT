<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión - Lavados App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=15">
  <style>
    :root {
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --bg-dark: #0f172a;
      --bg-darker: #020617;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-darker);
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 85% 30%, rgba(14, 165, 233, 0.15) 0%, transparent 50%);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Fondo animado sutil */
    .bg-animation {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 0;
      overflow: hidden;
    }
    .blob {
      position: absolute;
      filter: blur(80px);
      z-index: 0;
      opacity: 0.6;
      animation: float 20s infinite alternate ease-in-out;
    }
    .blob-1 {
      top: -10%; left: -10%;
      width: 50vw; height: 50vw;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.3) 0%, transparent 70%);
      animation-delay: 0s;
    }
    .blob-2 {
      bottom: -10%; right: -10%;
      width: 60vw; height: 60vw;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.2) 0%, transparent 70%);
      animation-delay: -5s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(5%, 10%) scale(1.1); }
      100% { transform: translate(-5%, 5%) scale(0.9); }
    }
    
    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 48px 40px;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
      text-align: center;
      z-index: 10;
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    
    .logo-wrap {
      position: relative;
      width: 72px;
      height: 72px;
      margin: 0 auto 24px auto;
    }
    
    .login-logo {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #3b82f6, #0ea5e9);
      color: white;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      box-shadow: 0 12px 32px rgba(59, 130, 246, 0.4);
      position: relative;
      z-index: 2;
    }

    .logo-glow {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #3b82f6;
      border-radius: 20px;
      filter: blur(15px);
      opacity: 0.7;
      z-index: 1;
      animation: pulse 3s infinite alternate;
    }

    @keyframes pulse {
      0% { opacity: 0.5; transform: scale(0.95); }
      100% { opacity: 0.8; transform: scale(1.05); }
    }
    
    .login-title {
      color: var(--text);
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -0.03em;
    }
    
    .login-subtitle {
      color: var(--text-muted);
      font-size: 15px;
      margin-bottom: 36px;
      font-weight: 500;
    }
    
    .form-group {
      text-align: left;
      margin-bottom: 24px;
      position: relative;
    }
    
    .form-group label {
      display: block;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      margin-left: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .form-input {
      width: 100%;
      padding: 14px 18px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      color: white;
      font-family: inherit;
      font-size: 15px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
    }
    
    .form-input:focus {
      border-color: var(--primary);
      background: rgba(0, 0, 0, 0.4);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
      transform: translateY(-2px);
    }
    
    .form-input::placeholder {
      color: rgba(255, 255, 255, 0.2);
    }
    
    .login-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--primary), #2563eb);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3), inset 0 1px 0 rgba(255,255,255,0.2);
      letter-spacing: 0.02em;
    }
    
    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.4), inset 0 1px 0 rgba(255,255,255,0.2);
      background: linear-gradient(135deg, #4f46e5, var(--primary));
    }

    .login-btn:active {
      transform: translateY(1px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    
    .error-msg {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }
  </style>
</head>
<body>

  <!-- Fondo interactivo -->
  <div class="bg-animation">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="login-container">
    <div class="logo-wrap">
      <div class="logo-glow"></div>
      <div class="login-logo">💧</div>
    </div>
    
    <div class="login-title">Lavados App</div>
    <div class="login-subtitle">Ingresa tus credenciales para continuar</div>
    
    {% if error %}
    <div class="error-msg">
      <span>⚠️</span> {{ error }}
    </div>
    {% endif %}
    
    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" class="form-input" placeholder="Ej. admin" required autofocus autocomplete="username">
      </div>
      
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
      </div>
      
      <button type="submit" class="login-btn">Acceder al Sistema</button>
    </form>
  </div>

</body>
</html>
